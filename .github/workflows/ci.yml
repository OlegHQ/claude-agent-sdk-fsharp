name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - dev

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build_test:
    name: "🧪 Build & Test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: "8.0.x"
      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.fsproj', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Restore
        run: |
          dotnet restore src/ClaudeAgentSdk/ClaudeAgentSdk.fsproj
          dotnet restore examples/BasicUsage/BasicUsage.fsproj
          dotnet restore tests/ClaudeAgentSdk.Tests/ClaudeAgentSdk.Tests.fsproj
      - name: Build SDK
        run: dotnet build src/ClaudeAgentSdk/ClaudeAgentSdk.fsproj -c Release --no-restore
      - name: Build Examples
        run: dotnet build examples/BasicUsage/BasicUsage.fsproj -c Release --no-restore
      - name: Test
        run: dotnet test tests/ClaudeAgentSdk.Tests/ClaudeAgentSdk.Tests.fsproj -c Release --no-restore --logger "trx;LogFileName=test-results.trx" --results-directory TestResults
      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@27d65e188ec43221b20d26de30f4892fad91df2f
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        with:
          files: TestResults/test-results.trx
